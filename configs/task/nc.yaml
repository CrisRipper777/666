name: nc
protocol_version: unified_full_graph_nc_v1

training_mode: full_graph # full_graph | sampled; unified protocol fixes full_graph
optimizer: adamw # adamw | adam

epochs: 300
lr: 1e-3
weight_decay: 1e-4
batch_size: 1024
num_neighbors: 15
inference_mode: full
inference_batch_size: 4096
eval_every: 1
patience: 30
early_stop_min_epoch: 30
early_stop_min_delta: 1e-4
grad_clip: 1.0
max_train_batches: null

save_ckpt_path: null
run_metrics_path: null
run_diagnostics_path: null
collect_model_diagnostics: false
profile_runtime: false
scheduler: null
scheduler_warmup_epochs: 10
scheduler_min_lr: 1.0e-5

loss:
  aux_weight: 1.0

evaluate_test: true

# Optional physical graph override for isolated topology controls.
edge_index_override_path: null
